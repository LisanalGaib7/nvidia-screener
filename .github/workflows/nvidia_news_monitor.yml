name: 🟢 NVIDIA 투자 뉴스 감지

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST — 전일 미국장 투자 뉴스 커버
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 투자 뉴스 확인
        id: news_check
        run: python scripts/check_news.py

      - name: Telegram 알림 (뉴스 감지 시)
        if: steps.news_check.outputs.found == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat news_alert.txt)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # 발송 이력. 이게 없으면 창이 겹치는 구간의 기사가 다음 회차에 다시 나간다.
      - name: 발송 이력 커밋 (변경 시에만)
        if: steps.news_check.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvidia_news_state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: news alert state [skip ci]"
          # main이 아닌 ref(브랜치 테스트 발송)에서 돌면 자기 커밋을 main 위로
          # rebase하려다 충돌한다 — 실측 2026-09-19. 현재 ref를 따라간다.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
