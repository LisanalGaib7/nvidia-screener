name: 🟠 한화엔진 수주·계약 감지

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-hanwha-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 한화엔진 수주·계약 뉴스 확인
        id: hanwha_news_check
        run: python scripts/check_hanwha_news.py

      - name: Telegram 알림 (뉴스 감지 시)
        if: steps.hanwha_news_check.outputs.found == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat hanwha_news_alert.txt)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # 발송 이력. 이게 없으면 창이 겹치는 구간의 기사가 다음 회차에 다시 나간다.
      - name: 발송 이력 커밋 (변경 시에만)
        if: steps.hanwha_news_check.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hanwha_news_state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: news alert state [skip ci]"
          git pull --rebase --autostash origin main
          git push
