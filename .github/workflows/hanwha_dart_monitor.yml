name: 🟠 한화엔진 공시 감지

on:
  schedule:
    # 매시 정각. 뉴스 모니터(일 1회)와 달리 공시는 즉시성이 값이라 시간당으로 돈다.
    # DART 키 한도는 2만콜/일이라 24회는 부담이 없고, 중복 발송은 발송 이력
    # (data/hanwha_dart_state.json)으로 막는다 — DART가 접수 시각을 안 주기 때문.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-hanwha-dart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 한화엔진 DART 공시 확인
        id: dart_check
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/check_hanwha_dart.py

      - name: Telegram 알림 (공시 감지 시)
        if: steps.dart_check.outputs.found == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat hanwha_dart_alert.txt)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # 컨센서스는 확정 발표 시점에 네이버가 실제값으로 덮어쓰므로 미리 쌓아둬야 한다.
      # 발송 이력도 같이 커밋해야 다음 회차가 중복을 안 보낸다.
      - name: 상태 파일 커밋 (변경 시에만)
        if: steps.dart_check.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hanwha_consensus.json data/hanwha_dart_state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: hanwha consensus/alert state [skip ci]"
          git pull --rebase --autostash origin main
          git push
