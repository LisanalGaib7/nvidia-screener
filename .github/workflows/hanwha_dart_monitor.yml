name: 🟠 한화엔진 공시 감지

on:
  schedule:
    # 매시 30분. (정각은 뉴스 모니터 3종의 상태 파일 푸시와 겹친다) 뉴스 모니터(일 1회)와 달리 공시는 즉시성이 값이라 시간당으로 돈다.
    # DART 키 한도는 2만콜/일이라 24회는 부담이 없고, 중복 발송은 발송 이력
    # (data/hanwha_dart_state.json)으로 막는다 — DART가 접수 시각을 안 주기 때문.
    - cron: '30 * * * *'
    # 실험(2026-10-25~): GitHub가 예약 실행을 대부분 건너뛴다 — 30일 720회 중 143회(20%)만 돌아,
    # 평일 08~20시 KST에 뜬 공시를 잡기까지 중간값 3.0h, p90 6.2h, 최대 10.3h 걸렸다.
    # 공시가 몰리는 평일 KST 08~20시만 10분 간격으로 촘촘히 건다(분은 :30과 안 겹치게 3,13,…,53).
    # 판정: 첫 한 주의 같은 대기 중간값이 1h 이하면 유지, 아니면 매시로 되돌린다.
    - cron: '3-59/10 23 * * 0-4'   # 월~금 08시대 KST
    - cron: '3-59/10 0-10 * * 1-5' # 월~금 09~19시대 KST
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '조회 범위(일). 놓친 공시 수동 소급이나 발송 경로 점검용.'
        required: false
        default: '2'

permissions:
  contents: write

# 한 번에 하나씩 — 두 회차가 겹치면 둘 다 같은 이력을 읽고 같은 공시를 두 번 보낸다.
concurrency:
  group: hanwha-dart
  cancel-in-progress: false

jobs:
  monitor-hanwha-dart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 예약 시점의 커밋이 아니라 지금 브랜치 끝을 받는다 — 앞 회차가 막 올린 발송 이력을 읽으려고.
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 한화엔진 DART 공시 확인
        id: dart_check
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python scripts/check_hanwha_dart.py

      - name: Telegram 알림 (공시 감지 시)
        if: steps.dart_check.outputs.found == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat hanwha_dart_alert.txt)
          # 실패를 숨기지 않는다 — 이 단계가 실패하면 이력 커밋이 건너뛰어져 다음 회차가 다시 보낸다.
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # 컨센서스는 확정 발표 시점에 네이버가 실제값으로 덮어쓰므로 미리 쌓아둬야 한다.
      # 발송 이력도 같이 커밋해야 다음 회차가 중복을 안 보낸다.
      - name: 상태 파일 커밋 (변경 시에만)
        if: steps.dart_check.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hanwha_consensus.json data/hanwha_dart_state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: hanwha consensus/alert state [skip ci]"
          # main이 아닌 ref(브랜치 테스트 발송)에서 돌면 자기 커밋을 main 위로
          # rebase하려다 충돌한다 — 실측 2026-09-19. 현재 ref를 따라간다.
          # 다른 워크플로와 push가 겹치면 거절된다 — 받아서 다시 올린다.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
