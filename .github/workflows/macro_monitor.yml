name: ‼️ Macro Risk Monitor

on:
  schedule:
    - cron: '0 23 * * 1-5'   # 평일 23:00 UTC = 08:00 KST
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send test alert to preview message format'
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run macro monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE:          ${{ inputs.test_mode }}
        run: python scripts/check_macro.py

      # 조회 하나가 실패해도 스크립트는 상태를 저장한 뒤 실패로 끝난다. 그때도
      # 커밋해야 이미 보낸 다른 알림이 다음 회차에 중복으로 안 나간다.
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro_state.json
          git diff --staged --quiet || git commit -m "chore: update macro state [skip ci]"
          git push
